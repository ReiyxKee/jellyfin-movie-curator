# Compile check on every push / pull request (no release is made).
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet publish Jellyfin.Plugin.MovieCurator.csproj -c Release -o bin/publish

      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.MovieCurator
          path: bin/publish/Jellyfin.Plugin.MovieCurator.dll
          retention-days: 7
